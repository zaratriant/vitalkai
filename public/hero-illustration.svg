<!-- Hero Illustration - Abstract AI Network -->
<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="heroGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#14b8a6;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="heroGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:0.2" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circles -->
  <circle cx="400" cy="300" r="250" fill="url(#heroGrad1)" />
  <circle cx="450" cy="250" r="180" fill="url(#heroGrad2)" />
  <circle cx="350" cy="350" r="120" fill="url(#heroGrad1)" />
  
  <!-- Network nodes -->
  <g filter="url(#glow)">
    <circle cx="300" cy="200" r="8" fill="#0ea5e9" />
    <circle cx="500" cy="200" r="8" fill="#14b8a6" />
    <circle cx="400" cy="300" r="10" fill="#6366f1" />
    <circle cx="250" cy="350" r="6" fill="#0ea5e9" />
    <circle cx="550" cy="350" r="6" fill="#14b8a6" />
    <circle cx="400" cy="400" r="8" fill="#6366f1" />
    <circle cx="350" cy="250" r="5" fill="#0ea5e9" />
    <circle cx="450" cy="250" r="5" fill="#14b8a6" />
    <circle cx="300" cy="350" r="5" fill="#6366f1" />
    <circle cx="500" cy="350" r="5" fill="#0ea5e9" />
  </g>
  
  <!-- Connection lines -->
  <g stroke="#0ea5e9" stroke-width="1" opacity="0.4">
    <line x1="300" y1="200" x2="400" y2="300" />
    <line x1="500" y1="200" x2="400" y2="300" />
    <line x1="250" y1="350" x2="400" y2="300" />
    <line x1="550" y1="350" x2="400" y2="300" />
    <line x1="400" y1="400" x2="400" y2="300" />
    <line x1="350" y1="250" x2="400" y2="300" />
    <line x1="450" y1="250" x2="400" y2="300" />
    <line x1="300" y1="200" x2="350" y2="250" />
    <line x1="500" y1="200" x2="450" y2="250" />
    <line x1="250" y1="350" x2="300" y2="350" />
    <line x1="550" y1="350" x2="500" y2="350" />
    <line x1="300" y1="350" x2="400" y2="400" />
    <line x1="500" y1="350" x2="400" y2="400" />
  </g>
  
  <!-- Animated pulses -->
  <circle cx="400" cy="300" r="15" fill="none" stroke="#0ea5e9" stroke-width="2" opacity="0.6">
    <animate attributeName="r" from="15" to="30" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" from="0.6" to="0" dur="2s" repeatCount="indefinite" />
  </circle>
</svg>
